plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.cnjmj.floatclock'
    compileSdk 34

    defaultConfig {
        applicationId "cn.cnjmj.floatclock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零第三方依赖：纯 android.* 框架 API，构建无需额外下载
}
